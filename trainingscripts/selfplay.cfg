
# Rule lists are sampled uniformly per game. Repeating an entry gives it more
# weight, for example: repetitionRules = 2,2,2,3
repetitionRules = 2,3
noLegalMoveRules = LOSE,DRAW,COUNT

# Ordinary starting games sample the move limit as:
# clamp(base + Exp(mean positiveScale) - Exp(mean negativeScale), min, max)
maxMovesRandomBase = 150
maxMovesRandomPositiveScale = 80
maxMovesRandomNegativeScale = 30
maxMovesRandomMin = 10
maxMovesRandomMax = 700

# With this probability, independently initialize every point as empty (50%),
# black (25%), or white (25%). The first player is then chosen uniformly.
randomInitialBoardProb = 0.0
# Random boards missing either color are always resampled. Otherwise, after
# one raw NN evaluation, reject with probability min(cap, 1-(1-k)^power), where
# k = max(abs(blackWinProb - whiteWinProb), drawProb). Cap is in [0,1]
# and power is in (0,100]. A cap of 0 skips both NN evaluation and rejection.
# In a match between different models, one model is chosen uniformly per game
# and reused for all resampling attempts in that game.
randomInitialBoardRejectProbCap = 0.995
randomInitialBoardRejectProbPower = 1.0
# Maximum NN-rejected resamples. On reaching this limit, accept the last
# candidate that contains at least one black and one white piece.
randomInitialBoardMaxResampleAttempts = 10000

validationProp=0.0

useGraphSearch=false
numNNServerThreadsPerModel = 2
gpuToUseThread0 = 0
gpuToUseThread1 = 1

switchNetsMidGame=false

numGameThreads = 2048
nnMaxBatchSize = 1024

maxVisits = 150

cheapSearchProb = 0.75
cheapSearchTargetWeight = 0.0
cheapSearchVisits =30

reduceVisits = true
reduceVisitsThreshold = 0.90
reduceVisitsThresholdLookback = 3
reducedVisitsWeight = 0.1
reducedVisitsMin = 20


dataBoardLen = 6
bSizes = 6
bSizeRelProbs = 1

