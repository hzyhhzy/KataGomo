basicRules = RENJU
VCNRules = NOVC
firstPassWinRules = false
bSizes = 15
bSizeRelProbs = 1
libOpeningProb = 0.0
useVCFInput0 = true
useVCFInput1 = true
useForbiddenInput0 = true
useForbiddenInput1 = true
useUncertainty = false
useNoisePruning = false
subtreeValueBiasFactor = 0.0
allowEarlyDraw = true
earlyDrawThreshold = 0.98
earlyDrawConsecTurns = 4
earlyDrawProbSelfplay = 0.9
noResultUtilityReduce = 0.5
maxMovesPerGame = 1200
allowResignation = false
resignThreshold = -0.95
resignConsecTurns = 6
cudaUseFP16 = true
cudaUseNHWC = true
cudaUseINT8 = false
nnMutexPoolSizePowerOfTwo = 20
nnRandomize = true
chosenMoveTemperatureEarly = 0.5
chosenMoveTemperatureHalflife = 7
chosenMoveTemperature = 0.05
winLossUtilityFactor0 = 1.0
winLossUtilityFactor1 = 1.0
cpuctExploration0 = 1.0
cpuctExploration1 = 1.0
